name: Maven CI

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'trabajo/**'
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify with Maven
        run: mvn --batch-mode clean verify
